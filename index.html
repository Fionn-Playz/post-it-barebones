<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Post-It Note</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #0f172a;
      font-family: cursive, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .note-paper {
      width: 100%;
      max-width: 420px;
      height: 100%;
      max-height: 420px;
      background: linear-gradient(135deg, #ffff88 0%, #ffff55 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border-radius: 2px;
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
    }
    .note-paper.peeling {
      transform: rotate(-18deg) translateY(-120%) scale(0.6) !important;
      opacity: 0;
    }
    .toolbar {
      display: flex;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.06);
      border-bottom: 1px dashed rgba(0,0,0,0.08);
      z-index: 4;
      user-select: none;
    }
    .tool-btn {
      font-size: 11px;
      font-family: sans-serif;
      font-weight: bold;
      border: none;
      background: rgba(255,255,255,0.7);
      color: #713f12;
      padding: 3px 9px;
      border-radius: 4px;
      cursor: pointer;
    }
    .tool-btn.active { background: #713f12; color: #fef08a; }
    .body-container {
      position: relative;
      width: 100%;
      flex: 1;
    }
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }
    textarea {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      background: transparent;
      padding: 12px;
      font-size: 20px;
      line-height: 1.2;
      outline: none;
      color: #1e1b4b;
      resize: none;
      font-family: cursive, sans-serif;
      z-index: 2;
    }
    .fold {
      position: absolute;
      bottom: 0; right: 0;
      width: 36px; height: 36px;
      background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,0.15) 51%, #eab308 55%, #fef08a 100%);
      border-top-left-radius: 12px;
      box-shadow: -2px -2px 6px rgba(0,0,0,0.15);
      cursor: pointer;
      z-index: 5;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fold:hover {
      transform: scale(1.25) translate(-3px, -3px);
    }
  </style>
</head>
<body>

  <div class="note-paper" id="paper">
    <div class="toolbar">
      <button class="tool-btn active" id="penBtn">✏️ Pen</button>
      <button class="tool-btn" id="eraseBtn">🧹 Erase</button>
      <button class="tool-btn" id="clearBtn">🗑️ Clear All</button>
    </div>
    <div class="body-container" id="container">
      <canvas id="cvs"></canvas>
      <textarea id="txt" placeholder="Write or scribble..."></textarea>
    </div>
    <div class="fold" id="closeBtn" title="Close Tab"></div>
  </div>

  <script>
    const paper = document.getElementById('paper');
    const cvs = document.getElementById('cvs');
    const container = document.getElementById('container');
    const txt = document.getElementById('txt');
    const ctx = cvs.getContext('2d');
    const penBtn = document.getElementById('penBtn');
    const eraseBtn = document.getElementById('eraseBtn');
    const clearBtn = document.getElementById('clearBtn');

    let currentTool = 'pen';

    // Random tilt on open
    const tilt = (Math.random() * 8 - 4).toFixed(1);
    paper.style.transform = `rotate(${tilt}deg)`;

    function setupCanvas() {
      const rect = container.getBoundingClientRect();
      cvs.width = rect.width * (window.devicePixelRatio || 1);
      cvs.height = rect.height * (window.devicePixelRatio || 1);
      ctx.scale(window.devicePixelRatio || 1, window.devicePixelRatio || 1);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      restoreData();
    }

    window.addEventListener('resize', setupCanvas);
    setTimeout(setupCanvas, 50);

    penBtn.onclick = () => {
      currentTool = 'pen';
      penBtn.classList.add('active');
      eraseBtn.classList.remove('active');
    };

    eraseBtn.onclick = () => {
      currentTool = 'erase';
      eraseBtn.classList.add('active');
      penBtn.classList.remove('active');
    };

    clearBtn.onclick = () => {
      ctx.clearRect(0, 0, cvs.width, cvs.height);
      txt.value = '';
      saveData();
    };

    function saveData() {
      localStorage.setItem('postit_direct_text', txt.value);
      localStorage.setItem('postit_direct_draw', cvs.toDataURL());
    }

    function restoreData() {
      const savedText = localStorage.getItem('postit_direct_text');
      const savedDraw = localStorage.getItem('postit_direct_draw');
      if (savedText) txt.value = savedText;
      if (savedDraw) {
        const img = new Image();
        img.onload = () => {
          const rect = container.getBoundingClientRect();
          ctx.drawImage(img, 0, 0, rect.width, rect.height);
        };
        img.src = savedDraw;
      }
    }

    txt.oninput = saveData;

    // Peel off and close tab
    document.getElementById('closeBtn').onclick = () => {
      paper.classList.add('peeling');
      setTimeout(() => {
        window.close();
        // Fallback if browser security blocks closing user-opened tab
        location.href = "about:blank";
      }, 320);
    };

    // Drawing and typing simultaneously
    let isDrawing = false;
    txt.onpointerdown = e => {
      isDrawing = true;
      txt.setPointerCapture(e.pointerId);
      const rect = txt.getBoundingClientRect();

      ctx.beginPath();
      if (currentTool === 'erase') {
        ctx.globalCompositeOperation = 'destination-out';
        ctx.lineWidth = 20;
      } else {
        ctx.globalCompositeOperation = 'source-over';
        ctx.strokeStyle = '#1d4ed8';
        ctx.lineWidth = 2.5;
      }
      ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    };

    txt.onpointermove = e => {
      if (!isDrawing) return;
      const rect = txt.getBoundingClientRect();
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
    };

    txt.onpointerup = txt.onpointercancel = () => { 
      if (isDrawing) {
        isDrawing = false; 
        saveData();
      }
    };
  </script>
</body>
</html>
